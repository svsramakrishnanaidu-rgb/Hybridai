name: HYDRO AI quality checks
on:
  push:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - '.github/workflows/quality.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hydro-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
